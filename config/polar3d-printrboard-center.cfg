# Polar3D + Printrboard sample for the polar-center-upgrade package.
# Experimental; software-tested only. Install the matching source first.
# Read README.md for installation, center calibration and dry-run commands.
# Copy YOUR verified pin flags, MCU serial and calibrated home offsets.
# Assumes stock mechanics, 200-step motors, 16 hardware microsteps.
# Factory X/Y/Z/E: 53.91 steps/mm, 41.48148 steps/degree, 3200, 100.4.
# Source: https://github.com/Polar3D/Polar-3D-Firmware/blob/master/Marlin/Configuration.h
# Pin baseline: https://github.com/Klipper3d/klipper/blob/master/config/generic-printrboard.cfg
# This is a complete sample, not an include to duplicate your main sections.
# Preserve your UI includes and existing board-current setup as needed.
# No heater_bed: the stock Polar3D bed is unheated.
# No input_shaper: unsupported by this experimental kinematics module.

# Original X connector: radial shuttle.
[stepper_arm]
step_pin: PA0
dir_pin: !PA1
enable_pin: !PE7
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 59.358190
endstop_pin: ^PE3
# Factory starting offset; measure nozzle-to-rotation-center distance
# at the radial sensor trigger. Do not overwrite a calibrated value.
position_endstop: 5.0
position_min: 0
position_max: 100
homing_positive_dir: false
homing_speed: 10
second_homing_speed: 2
homing_retract_dist: 2

# Original Y connector: rotary bed. No rotation_distance or endstop.
# 14:3 is the effective gear ratio, not asserted physical tooth counts.
[stepper_bed]
step_pin: PA2
dir_pin: PA3
enable_pin: !PE6
microsteps: 16
full_steps_per_rotation: 200
# Example regression-test gearing; retain your measured ratio on the printer.
gear_ratio: 14:3

[stepper_z]
step_pin: PA4
dir_pin: !PA5
enable_pin: !PC7
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 1.0
endstop_pin: ^PE4
# Nominal factory Z zero; calibrate actual nozzle height at trigger.
position_endstop: 0.0
position_min: 0
position_max: 150
homing_positive_dir: false
homing_speed: 2
second_homing_speed: 0.5
homing_retract_dist: 3

[extruder]
step_pin: PA6
dir_pin: PA7
enable_pin: !PC3
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 31.872510
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PF1
# Starting PID values only: PID_CALIBRATE, then SAVE_CONFIG.
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250
min_extrude_temp: 170

[fan]
pin: PC6

[mcu]
# REQUIRED: use your working serial path.
serial: /dev/serial/by-id/usb-Klipper_Klipper_firmware_12345-if00

# Initial motion limits, not hardware tuning results.
# Angular velocity/acceleration use rad/s and rad/s^2.
[printer]
kinematics: polar_center
max_angular_accel: 2.0
max_radial_velocity: 40
max_radial_accel: 300
polar_slow_radius: 5.0
max_velocity: 40
max_accel: 300
max_z_velocity: 3
max_z_accel: 30
square_corner_velocity: 1
max_radial_velocity_change: 1.0
max_angular_velocity_change: 0.02
max_angular_velocity: 1.0
